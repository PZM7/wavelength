name: wavelength
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: wavelength
      POSTGRES_USER: wavelength
      POSTGRES_PASSWORD: "${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in the ignored .env file}"
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wavelength -d wavelength"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./apps/backend
    ports: ["8080:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://postgres:5432/wavelength
      DATABASE_USERNAME: wavelength
      DATABASE_PASSWORD: "${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in the ignored .env file}"
      REDIS_HOST: redis
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-https://auth.invalid/}
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:-https://auth.invalid/.well-known/jwks.json}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-wavelength-api}
      DEV_SEED_ENABLED: ${DEV_SEED_ENABLED:-false}
      DEV_SEED_AUTH_SUBJECT: ${DEV_SEED_AUTH_SUBJECT:-dev|marc}
      MUSIC_TOKEN_KEYS: ${MUSIC_TOKEN_KEYS:-}
      MUSIC_PUBLIC_BASE_URL: ${MUSIC_PUBLIC_BASE_URL:-http://127.0.0.1:8080}
      MUSIC_WEB_RETURN_URI: ${MUSIC_WEB_RETURN_URI:-http://localhost:8081/music/callback}
      MUSIC_NATIVE_RETURN_URI: ${MUSIC_NATIVE_RETURN_URI:-wavelength://music/callback}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-http://127.0.0.1:8080/api/v1/music/spotify/callback}
      APPLE_MUSIC_TEAM_ID: ${APPLE_MUSIC_TEAM_ID:-}
      APPLE_MUSIC_KEY_ID: ${APPLE_MUSIC_KEY_ID:-}
      APPLE_MUSIC_PRIVATE_KEY_BASE64: ${APPLE_MUSIC_PRIVATE_KEY_BASE64:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
volumes:
  postgres_data:
