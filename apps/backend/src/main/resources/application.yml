spring:
  application:
    name: wavelength
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55432/wavelength}
    username: ${DATABASE_USERNAME:wavelength}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories.enabled: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints.web.exposure.include: health
  endpoint.health.show-details: never
  tracing.enabled: ${TRACING_ENABLED:false}
springdoc:
  api-docs.enabled: false
  swagger-ui.enabled: false
wavelength:
  auth:
    issuer: ${JWT_ISSUER_URI:https://auth.invalid/}
    jwk-set-uri: ${JWT_JWK_SET_URI:https://auth.invalid/.well-known/jwks.json}
    audience: ${JWT_AUDIENCE:wavelength-api}
    auto-provision: ${AUTH_AUTO_PROVISION:true}
  music:
    token-keys: ${MUSIC_TOKEN_KEYS:}
    public-base-url: ${MUSIC_PUBLIC_BASE_URL:}
    web-return-uri: ${MUSIC_WEB_RETURN_URI:}
    native-return-uri: ${MUSIC_NATIVE_RETURN_URI:wavelength://music/callback}
    spotify-client-id: ${SPOTIFY_CLIENT_ID:}
    spotify-redirect-uri: ${SPOTIFY_REDIRECT_URI:}
    apple-team-id: ${APPLE_MUSIC_TEAM_ID:}
    apple-key-id: ${APPLE_MUSIC_KEY_ID:}
    apple-private-key-base64: ${APPLE_MUSIC_PRIVATE_KEY_BASE64:}
  cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081}
logging:
  structured.format.console: logstash
  level:
    org.jooq.tools.LoggerListener: OFF
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
    org.hibernate.orm.jdbc.bind: OFF
